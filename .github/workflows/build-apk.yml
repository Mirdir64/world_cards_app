name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
        sudo apt update
        sudo apt install -y build-essential libpython3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libffi-dev libssl-dev libjpeg-dev libzbar-dev default-jdk wget unzip
        export JAVA_HOME=/usr/lib/jvm/default-java
        mkdir -p ~/android-sdk/cmdline-tools/latest
        cd ~/android-sdk
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip
        mv cmdline-tools/* cmdline-tools/latest/
        export ANDROID_SDK_ROOT=~/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;33.0.2"
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-33"
        cd $GITHUB_WORKSPACE

    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=~/android-sdk
        export JAVA_HOME=/usr/lib/jvm/default-java
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
